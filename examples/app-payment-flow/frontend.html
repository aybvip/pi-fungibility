<!DOCTYPE html>
<!--
  frontend.html — the official payment interface (U2A: User-To-App)
  Source: https://docs.minepi.com/accept-payment/Payments

  ⚠️ The key point (the proof):
     Pi.createPayment accepts only: amount / memo / metadata
     -> There is no field describing the "origin" of the incoming coin.
     An app owner cannot know whether the sender mined it or withdrew it from OKX/Bitget.
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pi Payment — Provenance Demo</title>
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
</head>
<body>
  <h1>π — Proof: an app cannot tell where a coin came from</h1>
  <p>Fields available to the app: <code>amount</code>, <code>memo</code>, <code>metadata</code> only.</p>
  <button id="buy">Pay 1 π</button>
  <pre id="log"></pre>

  <script>
    Pi.init({ version: "2.0", sandbox: true }); // sandbox: false in production

    const log = (m) => (document.getElementById("log").textContent += m + "\n");

    async function handleAuth() {
      const auth = await window.Pi.authenticate(["username", "payments"], onIncompletePayment);
      log(`✅ signed in: ${auth.user.username}`);
      return auth;
    }

    function onIncompletePayment(payment) {
      // Send payment.identifier to your backend to complete the interrupted payment
      log("⚠️ incomplete payment: " + payment.identifier);
    }

    document.getElementById("buy").addEventListener("click", async () => {
      const auth = await handleAuth();

      window.Pi.createPayment(
        {
          amount: 1,
          memo: "Unlock Premium",
          metadata: { feature: "premium" }
          // <- the officially allowed fields: amount / memo / metadata
          // <- there is no "origin", "source" or "mined" field
        },
        {
          onReadyForServerApproval: async (paymentId) => {
            log("→ onReadyForServerApproval: " + paymentId);
            const r = await fetch("/api/payments/approve", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                Authorization: `Bearer ${auth.accessToken}`,
              },
              body: JSON.stringify({ paymentId }),
            });
            log("   approve: " + r.status);
          },

          onReadyForServerCompletion: async (paymentId, txid) => {
            log("→ onReadyForServerCompletion: " + paymentId + " / " + txid);
            const r = await fetch("/api/payments/complete", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                Authorization: `Bearer ${auth.accessToken}`,
              },
              body: JSON.stringify({ paymentId, txid }),
            });
            log("   complete: " + r.status);
          },

          onCancel: (paymentId) => log("✋ cancelled: " + paymentId),
          onError: (error, payment) => log("❌ error: " + JSON.stringify(error) + " / " + JSON.stringify(payment)),
        }
      );
    });
  </script>
</body>
</html>
