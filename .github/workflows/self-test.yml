name: self-test

# Runs the reproducible proof self-test on every push / PR.
# The self-test is read-only and talks to the public Pi Mainnet API
# (https://api.mainnet.minepi.com) to make its assertions.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-deposit:
    name: verify-deposit self-test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [ '20.x', '22.x' ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run proof self-test (read-only, network)
        run: node examples/self-test.mjs

      - name: Run ledger model check (offline, deterministic)
        run: node examples/model-check.mjs

      - name: Show the committed sample output
        if: always()
        run: cat examples/self-test-output.txt
