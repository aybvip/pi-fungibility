name: self-test

# Runs the reproducible proof checks on every push / PR.
# All checks are read-only; the self-test talks to the public Pi Mainnet API
# (https://api.mainnet.minepi.com). The model and exhaustive checks are offline.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof-checks:
    name: proof checks (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [ '20.x', '22.x' ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run offline checks (deterministic)
        run: npm run offline

      - name: Run full check suite (read-only, includes live Mainnet reads)
        run: npm test

      - name: Show the committed sample output
        if: always()
        run: cat examples/self-test-output.txt

  build-site:
    name: build static site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build:site

      - name: Upload built site
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site
          retention-days: 7
